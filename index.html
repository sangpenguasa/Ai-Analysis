<div id="toast"></div><div id="sm" onclick="if(event.target===this)this.style.display='none'"><div id="smb"><input id="sq" placeholder="Cari coin… (mis. SOL, PEPE, DOGE)" oninput="smList()" autocomplete="off"><div id="sl"></div></div></div>

<script>
const COINS=['BTCUSDT','ETHUSDT','BNBUSDT','SOLUSDT','XRPUSDT','ADAUSDT','AVAXUSDT','DOGEUSDT','DOTUSDT','LINKUSDT'];
const TFS=['1m','5m','15m','1h','4h','1d'],CHART_TFS=['1m','3m','5m','15m','30m','1h','2h','4h','1d','1w'];let TK={};
// Parameter = default indikator Pine
const CFG={maLen:200,slope:3,pivot:5,adxMin:20,relVol:.8,minScore:65,rr:1.5,minStop:1,buf:.25,be:true};
const API='https://api.binance.com/api/v3';
const $=id=>document.getElementById(id);
const S={sym:'BTCUSDT',tf:'15m',auto:true,alerts:true};
const cache={};let px={},fund={},alertsLog=[],seen=new Set(),firstScan=true,chartKey='',pl=[];
let P={bal:10000,start:10000,pos:[],orders:[],hist:[]};
try{const s=JSON.parse(localStorage.getItem('nexus3'));if(s&&s.pos)P=s}catch(e){}
const save=()=>{try{localStorage.setItem('nexus3',JSON.stringify(P))}catch(e){}};
const fp=p=>p==null?'--':p>=1000?p.toFixed(1):p>=1?p.toFixed(3):p.toFixed(6);
const toast=m=>{if(!S.alerts)return;const t=$('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',3500)};

/* ---------- indikator ---------- */
const ema=(a,n)=>{const k=2/(n+1);let p;return a.map((v,i)=>p=i?v*k+p*(1-k):v)};
const rma=(a,n)=>{let p;return a.map((v,i)=>p=i<n?(i?(p*i+v)/(i+1):v):(p*(n-1)+v)/n)};
function stOf(K){const C=K.map(x=>x.c),a=ema(C,50),b=ema(C,200);return K.map((_,i)=>a[i]>b[i]?1:a[i]<b[i]?-1:0)}
function align(T,HK,hst){let j=0;return T.map(t=>{while(j+1<HK.length&&HK[j+1].t<=t)j++;return j>0&&HK[j].t<=t?hst[j-1]:0})}

/* ---------- ENGINE: port Pine "Auto Crypto Analyzer" ---------- */
function run(K,htf){
  const n=K.length,C=K.map(x=>x.c),H=K.map(x=>x.h),L=K.map(x=>x.l),V=K.map(x=>x.v);
  const e20=ema(C,20),e50=ema(C,50),e200=ema(C,200),ma=ema(C,CFG.maLen);
  const ch=C.map((c,i)=>i?c-C[i-1]:0),au=rma(ch.map(x=>x>0?x:0),14),ad=rma(ch.map(x=>x<0?-x:0),14);
  const rsi=au.map((u,i)=>ad[i]?100-100/(1+u/ad[i]):100);
  const m=ema(C,12).map((v,i)=>v-ema(C,26)[i]);const e26=ema(C,26),e12=ema(C,12);
  const ml=e12.map((v,i)=>v-e26[i]),sg=ema(ml,9),hist=ml.map((v,i)=>v-sg[i]);
  const tr=H.map((h,i)=>i?Math.max(h-L[i],Math.abs(h-C[i-1]),Math.abs(L[i]-C[i-1])):h-L[i]),atr=rma(tr,14);
  const up=H.map((h,i)=>i?h-H[i-1]:0),dn=L.map((l,i)=>i?L[i-1]-l:0);
  const pd=rma(up.map((u,i)=>u>dn[i]&&u>0?u:0),14),md=rma(dn.map((d,i)=>d>up[i]&&d>0?d:0),14);
  const dip=pd.map((v,i)=>100*v/atr[i]),dim=md.map((v,i)=>100*v/atr[i]);
  const adx=rma(dip.map((p,i)=>{const s=p+dim[i];return s?100*Math.abs(p-dim[i])/s:0}),14);
  const vm=V.map((_,i)=>i<19?0:V.slice(i-19,i+1).reduce((a,b)=>a+b)/20);
  let lh=null,ll=null,active=null,armed=true;const trades=[],markers=[],st={sig:0,tp1:0,tp2:0,tp3:0,sl:0,be:0,w:0,l:0,closed:0};let last={};
  const mk=(i,txt,pos,col,shape)=>markers.push({time:K[i].t,position:pos,color:col,shape,text:txt});
  for(let i=0;i<n;i++){
    const Pv=CFG.pivot;
    if(i>=2*Pv){const c=i-Pv;let a=true,b=true;for(let j=c-Pv;j<=c+Pv;j++)if(j!==c){if(H[j]>H[c])a=false;if(L[j]<L[c])b=false}if(a)lh=H[c];if(b)ll=L[c]}
    const cl=C[i],pc=i?C[i-1]:cl,hs=htf.map(a=>a[i]);
    const bBrk=lh!=null&&cl>lh&&pc<=lh,sBrk=ll!=null&&cl<ll&&pc>=ll,bSw=ll!=null&&L[i]<ll&&cl>ll,sSw=lh!=null&&H[i]>lh&&cl<lh;
    const bt=e20[i]>e50[i]&&e50[i]>e200[i]&&dip[i]>dim[i],srt=e20[i]<e50[i]&&e50[i]<e200[i]&&dim[i]>dip[i];
    const bm=rsi[i]>52&&hist[i]>0,sm=rsi[i]<48&&hist[i]<0,rv=vm[i]>0?V[i]/vm[i]:0,rvOK=rv>=CFG.relVol;
    const bh=hs.filter(x=>x===1).length,sh=hs.filter(x=>x===-1).length;
    const bs=(bt?25:0)+(bm?20:0)+(rvOK?15:0)+((bBrk||bSw)?25:0)+bh*5,brs=(srt?25:0)+(sm?20:0)+(rvOK?15:0)+((sBrk||sSw)?25:0)+sh*5;
    const mU=i>=CFG.slope&&ma[i]>ma[i-CFG.slope],mD=i>=CFG.slope&&ma[i]<ma[i-CFG.slope],mL=cl>ma[i]&&mU,mS=cl<ma[i]&&mD;
    const aOK=adx[i]>=CFG.adxMin;
    const okL=(bBrk||bSw)&&bt&&bm&&aOK&&rvOK&&mL&&bh>=1&&bs>=CFG.minScore;
    const okS=(sBrk||sSw)&&srt&&sm&&aOK&&rvOK&&mS&&sh>=1&&brs>=CFG.minScore;
    if(i===n-1)last={bs,brs,adx:adx[i],rsi:rsi[i],rv,hs,trend:bt?1:srt?-1:0,atr:atr[i],okL,okS,
      cL:[['Trigger: breakout / sweep swing',bBrk||bSw],['Trend EMA20>50>200 & DI+>DI−',bt],['Momentum RSI>52 & MACD hist>0',bm],['ADX ≥ '+CFG.adxMin,aOK],['Volume relatif ≥ '+CFG.relVol,rvOK],['MA'+CFG.maLen+' filter (harga di atas + slope naik)',mL],['Minimal 1 HTF bullish',bh>=1],['Skor ≥ '+CFG.minScore,bs>=CFG.minScore]],
      cS:[['Trigger: breakdown / sweep swing',sBrk||sSw],['Trend EMA20<50<200 & DI−>DI+',srt],['Momentum RSI<48 & MACD hist<0',sm],['ADX ≥ '+CFG.adxMin,aOK],['Volume relatif ≥ '+CFG.relVol,rvOK],['MA'+CFG.maLen+' filter (harga di bawah + slope turun)',mS],['Minimal 1 HTF bearish',sh>=1],['Skor ≥ '+CFG.minScore,brs>=CFG.minScore]]};
    if(!okL&&!okS)armed=true;
    let closedNow=false;
    if(active){const a=active,s=a.side,touched=s==1?L[i]<=a.sl:H[i]>=a.sl;
      if(touched){if(a.sl===a.entry){st.be++;a.status='BE';mk(i,'BE',s==1?'aboveBar':'belowBar','#ff8c00','square')}
        else{st.l++;st.sl++;a.status='SL';mk(i,'SL',s==1?'aboveBar':'belowBar','#ff3366','square')}
        st.closed++;active=null;closedNow=true;a.end=i}
      else{const t1=s==1?H[i]>=a.tp1:L[i]<=a.tp1,amb=!a.h1&&CFG.be&&t1&&(s==1?L[i]<=a.entry:H[i]>=a.entry);
        if(amb){a.sl=a.entry;st.be++;st.closed++;a.status='BE';mk(i,'BE',s==1?'aboveBar':'belowBar','#ff8c00','square');active=null;closedNow=true;a.end=i}
        else if(!a.h1&&t1){a.h1=1;st.tp1++;mk(i,'TP1',s==1?'aboveBar':'belowBar','#00ff88','circle');if(CFG.be)a.sl=a.entry}
        if(active&&a.h1&&!a.h2&&(s==1?H[i]>=a.tp2:L[i]<=a.tp2)){a.h2=1;st.tp2++;mk(i,'TP2',s==1?'aboveBar':'belowBar','#00ff88','circle')}
        if(active&&a.h2&&!a.h3&&(s==1?H[i]>=a.tp3:L[i]<=a.tp3)){a.h3=1;st.tp3++;st.w++;st.closed++;a.status='TP3';mk(i,'TP3',s==1?'aboveBar':'belowBar','#00ff88','circle');active=null;closedNow=true;a.end=i}}}
    if(!active&&!closedNow&&armed&&i>CFG.maLen&&(okL||okS)){
      const s=okL?1:-1,A=atr[i],sw=s==1?(ll==null?cl-A*CFG.minStop:ll-A*CFG.buf):(lh==null?cl+A*CFG.minStop:lh+A*CFG.buf);
      const sl=s==1?Math.min(sw,cl-A*CFG.minStop):Math.max(sw,cl+A*CFG.minStop),rk=Math.abs(cl-sl);
      const r1=Math.min(1,CFG.rr*.5),r2=Math.min(1.5,CFG.rr*.75);
      const t={i,time:K[i].t,side:s,entry:cl,sl,sl0:sl,risk:rk,tp1:cl+s*rk*r1,tp2:cl+s*rk*r2,tp3:cl+s*rk*CFG.rr,r1,r2,score:s==1?bs:brs,status:'ACTIVE',
        why:{brk:s==1?bBrk:sBrk,sw:s==1?ll:lh,adx:adx[i],rsi:rsi[i],hist:hist[i],rv,hs,atr:A,mq:s==1?mU:mD}};
      trades.push(t);active=t;armed=false;st.sig++;
      mk(i,s==1?'LONG':'SHORT',s==1?'belowBar':'aboveBar',s==1?'#00ff88':'#ff3366',s==1?'arrowUp':'arrowDown')}
  }
  return{K,trades,markers,st,last,active,ma,e20,e50}
}

/* ---------- data ---------- */
const parse=a=>a.map(x=>({t:x[0]/1000,o:+x[1],h:+x[2],l:+x[3],c:+x[4],v:+x[5]}));
async function kl(sym,tf){const r=await fetch(`${API}/klines?symbol=${sym}&interval=${tf}&limit=500`);return parse(await r.json())}
function analyze(sym){const D=cache[sym];Object.keys(D).forEach(tf=>calc(D,tf))}
async function loadSym(sym){const arr=await Promise.all(TFS.map(tf=>kl(sym,tf)));cache[sym]={};TFS.forEach((tf,i)=>cache[sym][tf]={K:arr[i]});analyze(sym)}
const cur=()=>cache[S.sym]&&cache[S.sym][S.tf];
const fresh=r=>r.active&&r.K.length-1-r.active.i<=3;
function best(sym){let b=null;TFS.forEach(tf=>{const r=cache[sym]&&cache[sym][tf]&&cache[sym][tf].res;if(!r)return;const f=fresh(r),sc=f?r.active.score:Math.max(r.last.bs,r.last.brs),v=(f?100:0)+sc;
  if(!b||v>b.v)b={tf,v,f,score:sc,side:f?r.active.side:(r.last.bs>=r.last.brs?1:-1)}});return b}

/* ---------- chart ---------- */
let chart,cs,vs,lma,l20,l50;
/* Loader: coba 3 CDN, kalau semua gagal pakai chart bawaan (canvas) */
function loadLib(){const U=['https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js','https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js','https://cdnjs.cloudflare.com/ajax/libs/lightweight-charts/4.1.3/lightweight-charts.standalone.production.js'];
  return new Promise(res=>{let i=0;setTimeout(res,9000);const next=()=>{if(window.LightweightCharts||i>=U.length)return res();const s=document.createElement('script');s.src=U[i++];s.onload=()=>res();s.onerror=next;document.head.appendChild(s)};next()})}
function miniChart(el){
  const cv=document.createElement('canvas');cv.style.cssText='width:100%;height:100%;display:block';el.appendChild(cv);const g=cv.getContext('2d');
  let W=0,H=0,from=0,to=130,SR=[],lines=[],raf=0,mx=-1,my=-1,cbs=[];
  const sched=()=>{if(!raf)raf=requestAnimationFrame(()=>{raf=0;draw()})};
  function size(){const r=el.getBoundingClientRect(),d=devicePixelRatio||1;W=r.width;H=r.height;cv.width=W*d;cv.height=H*d;g.setTransform(d,0,0,d,0,0);sched()}
  new ResizeObserver(size).observe(el);
  const mkS=(type,o)=>{const s={type,o:o||{},data:[],mk:[],setData(d){s.data=d;sched()},setMarkers(m){s.mk=m;sched()},createPriceLine(p){lines.push(p);sched();return p},removePriceLine(l){lines=lines.filter(x=>x!==l);sched()},applyOptions(){}};SR.push(s);return s};
  function draw(){
    g.fillStyle='#131722';g.fillRect(0,0,W,H);const c=SR.find(s=>s.type=='c');if(!c||!c.data.length||W<80)return;
    const C=c.data,AX=62,PW=W-AX,bw=PW/(to-from),X=i=>(i-from+.5)*bw,i0=Math.max(0,Math.floor(from)),i1=Math.min(C.length-1,Math.ceil(to));
    let hi=-1e18,lo=1e18;for(let i=i0;i<=i1;i++){hi=Math.max(hi,C[i].high);lo=Math.min(lo,C[i].low)}
    if(hi<lo)return;const pad=(hi-lo)*.06||hi*.001;hi+=pad;lo-=pad;const PH=H-18,Y=p=>(hi-p)/(hi-lo)*PH,idx=new Map(C.map((x,i)=>[x.time,i])),inR=i=>i!=null&&i>=i0&&i<=i1;
    g.font='10px Consolas,monospace';g.textAlign='left';g.lineWidth=1;
    for(let k=0;k<=6;k++){const p=lo+(hi-lo)*k/6,y=Y(p);g.strokeStyle='#1e222d';g.beginPath();g.moveTo(0,y);g.lineTo(PW,y);g.stroke();g.fillStyle='#94a3b8';g.fillText(fp(p),PW+4,y+3)}
    for(let k=0;k<5;k++){const i=Math.round(i0+(i1-i0)*k/4);if(C[i]){const d=new Date(C[i].time*1000);g.fillStyle='#475569';g.fillText(d.getDate()+'/'+(d.getMonth()+1)+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'),X(i)-18,H-4)}}
    const v=SR.find(s=>s.type=='h');if(v){let mv=0;v.data.forEach(d=>{if(inR(idx.get(d.time)))mv=Math.max(mv,d.value)});v.data.forEach(d=>{const i=idx.get(d.time);if(!inR(i))return;const h=d.value/(mv||1)*PH*.12;g.fillStyle=d.color||'#334';g.fillRect(X(i)-bw*.4,PH-h,bw*.8,h)})}

  if(fr>=1)P.pos=P.pos.filter(z=>z!==p);else{p.qty-=q;p.margin*=1-fr;p.fees-=of}save();toast(`${p.sym} ditutup ${(pn-fee-of)>=0?'+':''}${(pn-fee-of).toFixed(2)} (${why||'Manual'})`);renderAll()}
function liquidate(p){const L=liqOf(p);
  if(p.mode=='iso'){P.bal=Math.max(0,P.bal-p.margin);P.hist.unshift({time:new Date().toLocaleString(),sym:p.sym,dir:p.s==1?'LONG':'SHORT',lev:p.lev,qty:p.qty,entry:p.entry,exit:L,pnl:-p.margin-p.fees,why:'LIQUIDATED'});P.pos=P.pos.filter(z=>z!==p)}
  else{P.pos.filter(q=>q.mode=='cross').forEach(q=>P.hist.unshift({time:new Date().toLocaleString(),sym:q.sym,dir:q.s==1?'LONG':'SHORT',lev:q.lev,qty:q.qty,entry:q.entry,exit:pxOf(q),pnl:upnl(q,pxOf(q))-q.fees,why:'LIQUIDATED (cross)'}));

function engineTick(){let ch=false;
  P.orders=P.orders.filter(o=>{const x=px[o.sym];if(!x)return true;if(!(o.s==1?x<=o.price:x>=o.price))return true;
    if(o.margin*(1+o.lev*FEE_M)<=P.bal-(usedM()-o.margin)){addPos(o,o.price,FEE_M);toast(`Limit ${o.sym} terisi @${fp(o.price)}`)}ch=true;return false});

  if(!p){toast('Harga belum tersedia');return}if(!(m>0)){toast('Isi margin');return}if(lim&&!(lp>0)){toast('Isi harga limit');return}
  const ep=lim?lp:p;if(m*(1+lev*(lim?FEE_M:FEE_T))>avail()){toast('Margin tidak cukup');return}
  if(sl&&(s==1?sl>=ep:sl<=ep)){toast('SL harus '+(s==1?'di bawah':'di atas')+' harga entry');return}if(tp&&(s==1?tp<=ep:tp>=ep)){toast('TP harus '+(s==1?'di atas':'di bawah')+' harga entry');return}
  const o={sym:T.sym,s,margin:m,lev,mode:T.mode,sl,tp};
  if(lim&&(s==1?lp<p:lp>p)){P.orders.push({...o,id:newId(),price:lp});toast('Limit order dipasang')}else addPos(o,p,FEE_T);
  if(!sl)toast('Posisi tanpa SL — risiko likuidasi '+fp(liqOf(P.pos[P.pos.length-1]||{entry:p,s,lev,mode:'iso'})));
  save();renderAll()}
function followSignal(){const t=cur().res.active;if(!t){toast('Tidak ada sinyal aktif');return}const m=Math.max(10,avail()*.1),x=px[S.sym]||t.entry;if(m*(1+10*FEE_T)>avail()){toast('Saldo tidak cukup');return}
  addPos({sym:S.sym,s:t.side,margin:m,lev:Math.min(10,maxLev(S.sym)),mode:'iso',sl:t.sl0,tp:t.tp2},x,FEE_T);save();showTab('paper')}
function editTPSL(id){const p=P.pos.find(q=>q.id==id);if(!p)return;const r=prompt('Isi "SL,TP" (kosongkan untuk hapus). Contoh: 60000,70000',(p.sl||'')+','+(p.tp||''));if(r==null)return;
  const[a,b]=r.split(',').map(x=>x.trim()),sl=a?+a:null,tp=b?+b:null,x=pxOf(p);if((sl&&(p.s==1?sl>=x:sl<=x))||(tp&&(p.s==1?tp<=x:tp>=x))){toast('SL/TP tidak valid');return}p.sl=sl;p.tp=tp;save();renderAll()}
function cancelOrder(id){P.orders=P.orders.filter(o=>o.id!=id);save();renderAll()}
function resetAcc(){const v=prompt('Saldo awal (USDT):',P.start||10000);if(v==null||!(+v>0))return;P={bal:+v,start:+v,pos:[],orders:[],hist:[]};save();renderAll()}
/* ---------- pencarian coin ---------- */
let smCb=null;
function openSearch(cb){smCb=cb;$('sm').style.display='flex';$('sq').value='';$('sq').focus();smList()}
function smList(){const q=$('sq').value.toUpperCase().trim(),keys=Object.keys(TK).length?Object.keys(TK):COINS;
  const a=keys.filter(s=>!q||s.includes(q)).sort((x,y)=>(q&&(y.startsWith(q)-x.startsWith(q)))||((TK[y]||{vol:0}).vol-(TK[x]||{vol:0}).vol)).slice(0,80);
  $('sl').innerHTML=a.map(s=>{const k=TK[s]||{chg:0};return `<div class="sr" onclick="smPick('${s}')"><b>${s.replace(/USDT$/,'')}</b><span class="D">/USDT</span><span style="margin-left:auto">${fp(px[s])}</span><span class="${k.chg>=0?'G':'R'}" style="width:66px;text-align:right">${k.chg>=0?'+':''}${k.chg.toFixed(2)}%</span></div>`}).join('')||'<div class="D" style="padding:12px">Coin tidak ditemukan</div>'}
function smPick(s){$('sm').style.display='none';if(smCb)smCb(s)}
addEventListener('keydown',e=>{if(e.key=='Escape')$('sm').style.display='none'});
/* ---------- UI TRADE ---------- */
function setTSym(s){T.sym=s;calcT()}function setMode(m){T.mode=m;calcT()}function setType(t){T.type=t;calcT()}
function ticketHTML(){return `<div class="tr"><div class="card" id="tk"><h3>ORDER TICKET</h3>
<button class="btn" style="width:100%;margin-bottom:8px;font-size:13px" id="t-symb" onclick="openSearch(setTSym)"></button>
<div class="seg"><button class="btn" id="m-iso" onclick="setMode('iso')">ISOLATED</button><button class="btn" id="m-cross" onclick="setMode('cross')">CROSS</button></div>
<div class="seg"><button class="btn" id="o-market" onclick="setType('market')">MARKET</button><button class="btn" id="o-limit" onclick="setType('limit')">LIMIT</button></div>
<div class="fld" id="f-lp" style="display:none">HARGA LIMIT<input id="t-lp" type="number" step="any" oninput="calcT()"></div>
<div class="fld">LEVERAGE <b id="t-lv" style="color:var(--cy)">10</b>x<input id="t-lev" type="range" min="1" max="125" value="10" oninput="calcT()"></div>
<div class="fld">MARGIN (USDT) · tersedia <span id="t-av"></span><input id="t-m" type="number" step="any" value="100" oninput="calcT()"></div>
<div class="seg">${[25,50,75,100].map(p=>`<button class="btn" onclick="$('t-m').value=(Math.max(0,avail())*${p}/100/(1+(+$('t-lev').value)*FEE_T)*.999).toFixed(2);calcT()">${p}%</button>`).join('')}</div>
<div class="fld">STOP LOSS (kosong = tanpa SL)<input id="t-sl" type="number" step="any"></div>
<div class="fld">TAKE PROFIT (opsional)<input id="t-tp" type="number" step="any"></div>
<div id="t-pv" class="mono D" style="font-size:11px;margin-bottom:6px"></div>
<div class="seg"><button class="btn g big" onclick="placeOrder(1)">BUY / LONG</button><button class="btn r big" onclick="placeOrder(-1)">SELL / SHORT</button></div>
<div class="D" style="font-size:10px">Simulasi: harga spot Binance dipakai sebagai mark price; fee taker 0,05% / maker 0,02%; maintenance margin 0,4% (pendekatan, bukan tier resmi).</div>
</div><div id="tr-live"></div></div>`}
function calcT(){if(!$('tk'))return;const g=id=>+$(id).value,p=px[T.sym],ml=maxLev(T.sym),lv=$('t-lev');lv.max=ml;if(+lv.value>ml)lv.value=ml;$('t-lv').textContent=lv.value;
  $('t-symb').innerHTML=`🔍 ${T.sym} &nbsp;<span class="${(TK[T.sym]||{chg:0}).chg>=0?'G':'R'}">${fp(p)}</span>`;
  ['iso','cross'].forEach(m=>$('m-'+m).classList.toggle('on',T.mode==m));['market','limit'].forEach(m=>$('o-'+m).classList.toggle('on',T.type==m));$('f-lp').style.display=T.type=='limit'?'flex':'none';
  $('t-av').textContent='$'+Math.max(0,avail()).toFixed(2);const m=g('t-m'),lev=+lv.value,ep=T.type=='limit'&&g('t-lp')>0?g('t-lp'):p;if(!ep||!(m>0)){$('t-pv').textContent='';return}
  const n=m*lev,q=n/ep;$('t-pv').innerHTML=`Nilai posisi $${n.toFixed(2)} · Qty ${q.toFixed(q<1?5:3)}<br>Fee ≈ $${(n*(T.type=='limit'?FEE_M:FEE_T)).toFixed(3)}<br>Liq LONG ≈ <span class="Y">${fp(ep*(1-(1/lev-MMR)))}</span> · SHORT ≈ <span class="Y">${fp(ep*(1+(1/lev-MMR)))}</span>${T.mode=='cross'?'<br>(cross: harga liq nyata lebih jauh, tergantung saldo)':''}`}
function rPaper(){if(!$('tk')){$('p-paper').innerHTML=ticketHTML()}rTradeLive();calcT()}
function rTradeLive(){const el=$('tr-live');if(!el)return;const up=uPnL(),eq=P.bal+up,mm=P.pos.reduce((a,p)=>a+p.qty*pxOf(p)*MMR,0),tw=P.hist.reduce((a,t)=>a+t.pnl,0),usd=x=>'$'+x.toFixed(2),sg=x=>(x>=0?'+':'')+usd(x);
  const b=(a,v,c)=>`<div class="box"><i>${a}</i><b class="${c||''}">${v}</b></div>`,ratio=eq>0?mm/eq:1;
  let h=`<div style="text-align:right;margin-bottom:6px"><button class="btn" onclick="resetAcc()">RESET AKUN</button></div><div class="grid">${b('WALLET BALANCE',usd(P.bal))}${b('UNREALIZED PNL',sg(up),up>=0?'G':'R')}${b('MARGIN BALANCE',usd(eq))}${b('AVAILABLE',usd(Math.max(0,avail())))}${b('USED MARGIN',usd(usedM()))}${b('MARGIN RATIO',(ratio*100).toFixed(2)+'%',ratio>.8?'R':ratio>.5?'Y':'G')}${b('REALIZED PNL',sg(tw),tw>=0?'G':'R')}</div>`;
  h+=`<div class="card"><h3>POSISI (${P.pos.length})</h3>`+(P.pos.length?`<table><tr><th>SYMBOL</th><th>SIZE</th><th>ENTRY</th><th>MARK</th><th>LIQ</th><th>MARGIN</th><th>PNL (ROE)</th><th>TP / SL</th><th></th></tr>`+P.pos.map(p=>{const x=pxOf(p),pn=upnl(p,x);
    return `<tr><td class="cell" style="text-align:left" onclick="pick('${p.sym}','${S.tf}')"><b>${p.sym}</b><br><span class="${p.s==1?'G':'R'}">${p.s==1?'LONG':'SHORT'} ${p.lev}x ${p.mode=='iso'?'Iso':'Cross'}</span></td><td>${p.qty.toFixed(p.qty<1?5:3)}</td><td>${fp(p.entry)}</td><td>${fp(x)}</td><td class="Y">${fp(liqOf(p))}</td><td>${usd(p.margin)}</td><td class="${pn>=0?'G':'R'}">${sg(pn)} (${(pn/p.margin*100).toFixed(1)}%)</td><td>${p.tp?fp(p.tp):'--'} / ${p.sl?fp(p.sl):'--'}</td><td><button class="btn r" onclick="closePos(${p.id},1)">CLOSE</button> <button class="btn" onclick="closePos(${p.id},.5)">50%</button> <button class="btn" onclick="editTPSL(${p.id})">TP/SL</button></td></tr>`}).join('')+'</table>':'<span class="D">Tidak ada posisi terbuka.</span>')+'</div>';
  h+=`<div class="card"><h3>OPEN ORDERS (${P.orders.length})</h3>`+(P.orders.length?`<table><tr><th>SYMBOL</th><th>SIDE</th><th>HARGA</th><th>MARGIN</th><th>TP / SL</th><th></th></tr>`+P.orders.map(o=>`<tr><td>${o.sym}</td><td class="${o.s==1?'G':'R'}">${o.s==1?'LONG':'SHORT'} ${o.lev}x</td><td>${fp(o.price)}</td><td>${usd(o.margin)}</td><td>${o.tp?fp(o.tp):'--'} / ${o.sl?fp(o.sl):'--'}</td><td><button class="btn r" onclick="cancelOrder(${o.id})">BATAL</button></td></tr>`).join('')+'</table>':'<span class="D">Tidak ada order menunggu.</span>')+'</div>';
  el.innerHTML=h}
function rHist(){$('p-hist').innerHTML=`<div class="card"><h3>RIWAYAT TRADE</h3>`+(P.hist.length?`<table><tr><th>WAKTU</th><th>PAIR</th><th>SIDE</th><th>LEV</th><th>QTY</th><th>ENTRY</th><th>EXIT</th><th>PNL (NET FEE)</th><th>ALASAN</th></tr>`+P.hist.slice(0,200).map(t=>`<tr><td>${t.time}</td><td>${t.sym}</td><td class="${t.dir=='LONG'?'G':'R'}">${t.dir}</td><td>${t.lev||'-'}x</td><td>${t.qty?t.qty.toFixed(4):'-'}</td><td>${fp(t.entry)}</td><td>${fp(t.exit)}</td><td class="${t.pnl>=0?'G':'R'}">${t.pnl>=0?'+':''}$${t.pnl.toFixed(2)}</td><td class="${/LIQ/.test(t.why)?'R':''}">${t.why}</td></tr>`).join('')+'</table>':'<span class="D">Belum ada riwayat.</span>')+'</div>'}
function showOHLC(k){const d=cur();if(!d||!d.K.length)return;if(!k){const x=d.K[d.K.length-1];k={open:x.o,high:x.h,low:x.l,close:x.c}}const c=k.close>=k.open?'#26a69a':'#ef5350',ch=(k.close-k.open)/k.open*100;
  $('ohlc').innerHTML=`<b>${S.sym}</b> · ${S.tf.toUpperCase()} · Binance &nbsp;<span style="color:${c}">O ${fp(k.open)} H ${fp(k.high)} L ${fp(k.low)} C ${fp(k.close)} (${ch>=0?'+':''}${ch.toFixed(2)}%)</span>`}
async function ensureTF(sym,tf){const D=cache[sym];if(!D||(D[tf]&&D[tf].res))return;D[tf]={K:await kl(sym,tf)};calc(D,tf)}
function calc(D,tf){const hs=['1h','4h','1d'].map(t=>({K:D[t].K,st:stOf(D[t].K)})),Kc=D[tf].K.slice(0,-1),Tm=Kc.map(x=>x.t);D[tf].res=run(Kc,hs.map(h=>align(Tm,h.K,h.st)))}
async function loadTickers(){try{const a=await(await fetch(API+'/ticker/24hr')).json();TK={};a.forEach(d=>{if(d.symbol.endsWith('USDT')&&+d.quoteVolume>0){TK[d.symbol]={chg:+d.priceChangePercent,vol:+d.quoteVolume};px[d.symbol]=+d.lastPrice}})}catch(e){}}
function rStats(){const d=cur();if(!d||!d.res)return;const st=d.res.st,wr=st.w+st.l?(st.w/(st.w+st.l)*100).toFixed(1)+'%':'n/a',b=x=>`<div class="box"><i>${x[0]}</i><b>${x[1]}</b></div>`;
  let h=`<div class="card"><h3>STATISTIK INDIKATOR — ${S.sym} ${S.tf.toUpperCase()} (500 bar)</h3><div class="grid">${[['SIGNALS',st.sig],['CLOSED',st.closed],['WIN (TP3)',st.w],['LOSS (SL)',st.l],['BREAKEVEN',st.be],['WIN RATE',wr],['TP1 / TP2 / TP3',`${st.tp1} / ${st.tp2} / ${st.tp3}`]].map(b).join('')}</div><div class="D">Sampel kecil = kurang andal. Hasil historis bukan jaminan.</div></div>`;
  const pw=P.hist.filter(t=>t.pnl>0).length;h+=`<div class="card"><h3>PAPER TRADE</h3>${P.hist.length} trade · ${pw} win · total PNL $${P.hist.reduce((s,t)=>s+t.pnl,0).toFixed(2)}</div>`;
  h+=`<div class="card"><h3>FUNDING RATE (FUTURES)</h3>`+(Object.keys(fund).length?'<table><tr><th>COIN</th><th>RATE</th></tr>'+COINS.map(c=>`<tr><td>${c.replace('USDT','')}</td><td class="${fund[c]>=0?'R':'G'}">${fund[c]==null?'--':(fund[c]*100).toFixed(4)+'%'}</td></tr>`).join('')+'</table>':'<span class="D">Data tidak tersedia.</span>')+'</div>';
  $('p-stats').innerHTML=h}
function rAlerts(){$('p-alerts').innerHTML=`<div class="card"><h3>LOG SINYAL BARU</h3>`+(alertsLog.length?alertsLog.map(a=>`<div style="padding:5px 0;border-bottom:1px solid #121c33"><span class="D mono">${a.time}</span> <b class="${a.side==1?'G':'R'}">${a.side==1?'LONG':'SHORT'}</b> ${a.sym} ${a.tf.toUpperCase()} · skor ${a.score} · entry ${fp(a.entry)} · SL ${fp(a.sl)} · TP3 ${fp(a.tp3)}</div>`).join(''):'<span class="D">Belum ada sinyal baru.</span>')+'</div>'}

/* ---------- render & loop ---------- */
function rHeader(){const d=cache[S.sym];$('h-pair').textContent=S.sym;$('h-px').textContent=fp(px[S.sym]);
  if(d){const T=TFS.map(t=>d[t].res.last.trend);$('h-cons').innerHTML=`<span class="G">${T.filter(x=>x==1).length}</span> / <span class="R">${T.filter(x=>x==-1).length}</span>`}
  const w=P.hist.filter(t=>t.pnl>0).length;$('h-wr').textContent=P.hist.length?(w/P.hist.length*100).toFixed(0)+'%':'--%';
  const op=uPnL();$('h-pnl').textContent=(op>=0?'+':'')+'$'+op.toFixed(2);$('h-sig').textContent=alertsLog.length}
function renderAll(){rHeader();const a=document.querySelector('.pane.on').id;
  ({'p-chart':renderChart,'p-signal':rSignal,'p-mtf':rMTF,'p-scan':rScan,'p-paper':rPaper,'p-hist':rHist,'p-stats':rStats,'p-alerts':rAlerts})[a]()}
function checkAlerts(sym){TFS.forEach(tf=>{const r=cache[sym][tf].res;if(!fresh(r))return;const t=r.active,k=sym+tf+t.time;if(seen.has(k))return;seen.add(k);
  if(firstScan)return;alertsLog.unshift({time:new Date().toLocaleTimeString(),sym,tf,side:t.side,score:t.score,entry:t.entry,sl:t.sl0,tp3:t.tp3});
  toast(`${t.side==1?'LONG':'SHORT'} ${sym} ${tf.toUpperCase()} · skor ${t.score}`)})}
async function scanAll(){$('upd').textContent='scanning...';
  for(const c of [S.sym,...COINS.filter(x=>x!==S.sym)]){try{await loadSym(c);checkAlerts(c);if(c===S.sym){if(S.auto)autoTF();await ensureTF(S.sym,S.tf);tfBtns()}renderAll()}catch(e){}}
  firstScan=false;try{const r=await(await fetch('https://fapi.binance.com/fapi/v1/premiumIndex')).json();COINS.forEach(c=>{const f=r.find(x=>x.symbol===c);if(f)fund[c]=+f.lastFundingRate})}catch(e){}
  $('upd').textContent='update '+new Date().toLocaleTimeString();renderAll()}
async function refreshCur(){try{const D=cache[S.sym];if(!D)return;D[S.tf].K=await kl(S.sym,S.tf);analyze(S.sym);checkAlerts(S.sym);renderAll()}catch(e){}}
async function tick(){try{(await(await fetch(API+'/ticker/price')).json()).forEach(d=>px[d.symbol]=+d.price);engineTick();rHeader();if(document.querySelector('.pane.on').id=='p-paper'){rTradeLive();calcT()}}catch(e){}}
(async()=>{await loadLib();initChart();tfBtns();await loadTickers();await tick();await scanAll();setInterval(scanAll,120000);setInterval(loadTickers,60000);setInterval(refreshCur,5000);setInterval(tick,3000)})();
</script></body></html>
